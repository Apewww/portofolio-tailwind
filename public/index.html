<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ff007f" />
    <meta
      name="description"
      content="Rafly Anggara Portofolio - Backend Engineer"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Rafly Anggara P</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Cache busting: ?v=2 harus di-bump setiap kali sw.js diubah
          // agar browser tidak memakai sw.js lama dari HTTP cache
          navigator.serviceWorker.register('/sw.js?v=2')
            .then(registration => {
              // Deteksi SW baru yang sedang menunggu dan langsung aktifkan
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'activated') {
                    console.log('[SW] Service Worker baru telah aktif.');
                  }
                });
              });
            })
            .catch(err => console.error('[SW] Registrasi gagal:', err));
        });
      }
    </script>
  </body>
</html>
